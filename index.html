<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morita cacha por Claudio 😂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Plus+Jakarta+Sans:wght@500;700&display=swap"
    rel="stylesheet">
  <!-- Canvas Confetti para efectos -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: rgba(22, 27, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --primary-gradient: linear-gradient(135deg, #ff3366, #ff6b3d, #f9cb28);
      --neon-glow: 0 0 35px rgba(255, 51, 102, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: var(--bg-color);
      background-image:
        radial-gradient(at 0% 0%, rgba(255, 51, 102, 0.18) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(120, 50, 255, 0.18) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(249, 203, 40, 0.08) 0px, transparent 50%);
      font-family: 'Outfit', sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: min(94vw, 560px);
      margin: auto;
      perspective: 1000px;
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: clamp(20px, 5vw, 32px) clamp(14px, 4vw, 24px);
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), var(--neon-glow);
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7), 0 0 45px rgba(255, 51, 102, 0.5);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #fbbf24;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 16px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 51, 102, 0.3));
      letter-spacing: -0.5px;
      animation: pulseTitle 3s ease-in-out infinite alternate;
    }

    @keyframes pulseTitle {
      0% {
        transform: scale(1);
      }

      100% {
        transform: scale(1.02);
      }
    }

    .subtitle {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 28px;
    }

    .image-wrapper {
      position: relative;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 16px 0;
      cursor: pointer;
      transition: all 0.3s ease;
      padding: 10px;
    }

    .image-wrapper:hover {
      border-color: #ff3366;
      background: rgba(255, 51, 102, 0.05);
    }

    .image-wrapper img {
      max-width: 100%;
      max-height: 60vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
      border-radius: 14px;
      transition: transform 0.4s ease;
      margin: 0 auto;
    }

    .image-wrapper:hover img {
      transform: scale(1.02);
    }

    .placeholder-content {
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-muted);
    }

    .placeholder-icon {
      font-size: 3.5rem;
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      appearance: none;
      border: none;
      outline: none;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      padding: 12px 24px;
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(255, 51, 102, 0.6);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: scale(1.03);
    }

    .instructions {
      margin-top: 24px;
      padding: 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    .instructions code {
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      color: #f9cb28;
    }

    #file-input {
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="card">
      <div class="badge">🔥 Noticia de Último Minuto 💣</div>
      <h1 id="title-text">Morita cachada por Claudio</h1>


      <!-- Contenedor de Imagen con GIF de Tenor -->
      <div class="image-wrapper" id="drop-zone" title="Haz clic o arrastra una imagen para cambiarla">
        <img id="meme-img" src="mono.gif" alt="Mono que saca el dedo"
          onerror="this.onerror=null; this.src='https://media1.tenor.com/m/AeDxZNLg97sAAAAd/mono-que-saca-el-dedo.gif';">

        <div id="placeholder-box" class="placeholder-content" style="display: none;">
          <div class="placeholder-icon">📸</div>
          <p style="font-weight: 600; color: #fff;">¡Pon tu foto de broma aquí!</p>
          <p style="font-size: 0.85rem;">Guarda una imagen como <code>imagen.jpg</code> en esta carpeta o haz clic para
            subirla.</p>
        </div>
      </div>



      <input type="file" id="file-input" accept="image/*" onchange="previewSelectedImage(event)">


    </div>
  </main>

  <script>
    function handleImageError(img) {
      img.style.display = 'none';
      document.getElementById('placeholder-box').style.display = 'flex';
    }

    function previewSelectedImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (e) {
          const img = document.getElementById('meme-img');
          img.src = e.target.result;
          img.style.display = 'block';
          document.getElementById('placeholder-box').style.display = 'none';
          triggerCelebration();
        }
        reader.readAsDataURL(file);
      }
    }

    // Soporte Drag & Drop
    const dropZone = document.getElementById('drop-zone');
    dropZone.addEventListener('click', () => {
      document.getElementById('file-input').click();
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = '#f9cb28';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'rgba(255, 255, 255, 0.2)';
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = function (event) {
            const img = document.getElementById('meme-img');
            img.src = event.target.result;
            img.style.display = 'block';
            document.getElementById('placeholder-box').style.display = 'none';
            triggerCelebration();
          };
          reader.readAsDataURL(file);
        }
      }
    });

    // Efecto de Confeti
    function triggerCelebration() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    // Efecto de sonido sintético divertido
    function surpriseSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
        triggerCelebration();
      } catch (e) {
        console.log('AudioContext not allowed or supported');
      }
    }

    // Lanzar confeti al inicio
    window.addEventListener('load', () => {
      setTimeout(triggerCelebration, 400);
    });
  </script>
</body>

</html>
